<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Claim Lands</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%23f2b45c' d='M6 1l4 2.5v5L6 11 2 8.5v-5z'/%3E%3C/svg%3E">
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #030209; color: #ece4d4; font-family: ui-monospace, Menlo, Consolas, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8b809c; pointer-events: none; }
  #boot.hidden { display: none; }
</style>
</head>
<body>
<div id="boot">loading</div>
<script type="module">
  import init from './claimlands.js';
  const boot = document.getElementById('boot');
  init().then(() => boot.classList.add('hidden')).catch((e) => {
    boot.textContent = 'failed to start: ' + e;
    console.error(e);
  });
</script>
</body>
</html>
