name: branch-guard

# Defence in depth behind the branch-name ruleset: a branch whose name matches a banned pattern is
# deleted right after creation and any pull request from it is told why.
on:
  create:

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: check the new branch name
        id: check
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          if bash .github/policy/check.sh text "branch name" "$BRANCH"; then echo "bad=false" >> "$GITHUB_OUTPUT"; else echo "bad=true" >> "$GITHUB_OUTPUT"; fi
      - name: delete it
        if: steps.check.outputs.bad == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.ref }}
        run: |
          for pr in $(gh pr list --head "$BRANCH" --json number -q '.[].number'); do
            gh pr comment "$pr" --body "Branch \`$BRANCH\` matches a banned name pattern (.github/policy/banned.txt) and was deleted. Recreate it as \`<type>/<issue>-<slug>\` and push again."
          done
          git push origin --delete "$BRANCH"
