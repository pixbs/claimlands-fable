name: mobile

# Android and iOS builds run only after merges to main, nightly, and on demand. A failure opens or
# updates a `ci-failure` issue so nobody has to watch the runs.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: cargo install cargo-ndk --locked
      - run: cargo xtask android --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: cargo xtask ios --release

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - run: cargo xtask web

  report:
    needs: [android, ios, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: open, update or close the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: android=${{ needs.android.result }} ios=${{ needs.ios.result }} web=${{ needs.web.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: |
          title="mobile build failing on main"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-failure --state open --search "$title" --json number -q '.[0].number')
          body="Run: $RUN_URL
          Results: $RESULTS
          Commit: $GITHUB_SHA"
          if [ "$FAILED" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label ci-failure --label type:bug --label prio:p1 --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Green again. $body"
          fi
