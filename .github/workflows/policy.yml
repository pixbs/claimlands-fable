name: policy

# Attribution and naming firewall (docs/workflow.md). Required on main: a pull request cannot merge
# while this fails. Runs on every edit so a changed title or body is re-checked.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scrub known attribution footers from the PR body
        # Dependabot-triggered runs hold a read-only token: they are checked but not edited.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json body -q .body > body.md
          cp body.md body.orig
          # Footers agents append by habit; removing them keeps the PR mergeable once the rest is clean.
          # The keyword may be wrapped in markdown emphasis, so allow the `_` and `*` markers too.
          sed -i -E '/^[[:space:]]*[_*]*[[:space:]]*(🤖|Generated with|Generated by|Co-authored-by)/Id' body.md
          if ! cmp -s body.md body.orig; then
            # Such a footer sits under a horizontal rule; drop the rule its removal left hanging.
            while [ -s body.md ] && [ -z "$(tail -n 1 body.md | tr -d '[:space:]')" ]; do sed -i '$d' body.md; done
            if tail -n 1 body.md | grep -qE '^[[:space:]]*(-{3,}|\*{3,}|_{3,})[[:space:]]*$'; then sed -i '$d' body.md; fi
            gh pr edit "$PR" --body-file body.md
            echo "scrubbed attribution footer lines from the PR body" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: check branch name, title, body and every commit
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          SKIP_CLOSES: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '1' || '0' }}
          SKIP_BODY: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          [ -f body.md ] || gh pr view "$PR" --json body -q .body > body.md
          {
            bash .github/policy/check.sh branch "$HEAD_REF"
            bash .github/policy/check.sh pr-title "$TITLE"
            bash .github/policy/check.sh pr-body-file body.md
            bash .github/policy/check.sh commits "$BASE_SHA..$HEAD_SHA"
          } > findings.txt 2>&1
          added=$(git diff --numstat "$BASE_SHA..$HEAD_SHA" -- . ':!fixtures/**' ':!**/snapshots/**' ':!Cargo.lock' ':!vendor/**' | awk '{s+=$1} END {print s+0}')
          echo "added=$added" >> "$GITHUB_OUTPUT"
          if [ -s findings.txt ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            cat findings.txt
            {
              echo "### policy: blocked"
              echo '```'
              head -c 6000 findings.txt
              echo '```'
              echo 'Fix: rename the branch (`git branch -m <type>/<issue>-<slug>`), reword commits (`git commit --amend` or `git rebase -i`), then force-push; edit the title or body on GitHub. Rules: `.github/policy/banned.txt`, `docs/workflow.md`.'
            } > comment.md
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "### policy: ok" > comment.md
          fi
          if [ "$added" -gt 600 ]; then
            echo "" >> comment.md
            echo "Note: $added added lines outside fixtures and snapshots. Split into a stack if the review would benefit." >> comment.md
          fi
      - name: comment
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: policy
          path: comment.md
      - name: fail when findings exist
        if: steps.check.outputs.failed == 'true'
        run: exit 1
