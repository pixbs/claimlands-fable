name: policy

# Attribution and naming firewall (docs/workflow.md). Required on main: a pull request cannot merge
# while this fails. Runs on every edit so a changed title or body is re-checked.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scrub known attribution footers from the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json body -q .body > body.md
          cp body.md body.orig
          # Footers agents append by habit; removing them keeps the PR mergeable once the rest is clean.
          sed -i -E '/^[[:space:]]*(🤖|Generated with|Generated by|Co-authored-by)/Id' body.md
          if ! cmp -s body.md body.orig; then
            gh pr edit "$PR" --body-file body.md
            echo "scrubbed attribution footer lines from the PR body" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: check branch name, title, body and every commit
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          SKIP_CLOSES: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '1' || '0' }}
        run: |
          set +e
          {
            bash .github/policy/check.sh branch "$HEAD_REF"
            bash .github/policy/check.sh pr-title "$TITLE"
            bash .github/policy/check.sh pr-body-file body.md
            bash .github/policy/check.sh commits "$BASE_SHA..$HEAD_SHA"
          } > findings.txt 2>&1
          added=$(git diff --numstat "$BASE_SHA..$HEAD_SHA" -- . ':!fixtures/**' ':!**/snapshots/**' ':!Cargo.lock' ':!vendor/**' | awk '{s+=$1} END {print s+0}')
          echo "added=$added" >> "$GITHUB_OUTPUT"
          if [ -s findings.txt ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; cat findings.txt; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi
      - name: comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: policy
          message: |
            ${{ steps.check.outputs.failed == 'true' && '### policy: blocked' || '### policy: ok' }}
            ${{ steps.check.outputs.failed == 'true' && '```' || '' }}
            ${{ steps.check.outputs.failed == 'true' && '' || '' }}
            ${{ steps.check.outputs.failed == 'true' && '(see the job log for the offending lines)' || '' }}
            ${{ steps.check.outputs.failed == 'true' && '```' || '' }}
            ${{ steps.check.outputs.failed == 'true' && 'Fix: rename the branch (`git branch -m <type>/<issue>-<slug>`), reword commits (`git rebase -i` or `git commit --amend`), and edit the title/body. Rules: `.github/policy/banned.txt`, `docs/workflow.md`.' || '' }}
            ${{ steps.check.outputs.added > 600 && format('Note: {0} added lines outside fixtures and snapshots. Split into a stack if the review would benefit.', steps.check.outputs.added) || '' }}
      - name: fail when findings exist
        if: steps.check.outputs.failed == 'true'
        run: exit 1
