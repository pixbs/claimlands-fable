# actions/labeler v5: area labels from changed paths.
"area:cl-model":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-model/**"
"area:cl-noise":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-noise/**"
"area:cl-hexsphere":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-hexsphere/**"
"area:cl-worldgen":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-worldgen/**"
"area:cl-pixelart":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-pixelart/**"
"area:cl-scenery":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-scenery/**"
"area:cl-rules":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-rules/**"
"area:cl-level":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-level/**"
"area:cl-ai":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-ai/**"
"area:cl-session":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-session/**"
"area:cl-render":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-render/**"
"area:cl-ui":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-ui/**"
"area:cl-app":
  - changed-files:
      - any-glob-to-any-file: "crates/cl-app/**"
"area:xtask":
  - changed-files:
      - any-glob-to-any-file: ["xtask/**", ".github/**", ".githooks/**", "Cargo.toml", "clippy.toml", "deny.toml", "rustfmt.toml"]
"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "AGENTS.md", "README.md", "CONTRIBUTING.md", "crates/*/README.md"]
"area:platforms":
  - changed-files:
      - any-glob-to-any-file: "platforms/**"
"area:fixtures":
  - changed-files:
      - any-glob-to-any-file: ["fixtures/**", "reference/**"]
"deps":
  - changed-files:
      - any-glob-to-any-file: ["Cargo.lock", "vendor/**"]
