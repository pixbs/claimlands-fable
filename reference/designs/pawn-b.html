<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pawn B — Claim Lands reference</title><link rel="stylesheet" href="style.css"></head>
<body><main><nav aria-label="Reference designs"><a href="capital.html">Procedural capital</a><a href="pawn-a.html">Pawn A</a><a href="pawn-b.html">Pawn B</a><a href="warrior.html">Warrior</a><a href="knight.html">Knight</a><a href="star.html">Availability star</a></nav><h1>Pawn B</h1><p class="intro">Approved reference · prototype palette · drag to orbit, scroll to zoom</p><div id="wp-refined-study" data-design="pawn-b">
  <div class="viz-controls">
    <label class="form-label">Scenery under unit<select class="form-select" id="wp-cover"><option value="village">Village</option><option value="forest">Forest</option><option value="empty">Empty land</option></select></label>
  </div>
  <div class="viz-controls">
    <label class="form-label">Framing<select class="form-select" id="wp-framing"><option value="figure">Figure close-up</option><option value="tile">Above the tile</option></select></label>
  </div>
  <canvas id="wp-canvas" role="img" aria-label="Rotatable reference model. All geometry and ground texture share one world-pixel scale.">Rotatable reference model.</canvas>
  <div class="viz-row"><button type="button" class="btn" id="wp-spin" aria-pressed="false">Turntable</button><label class="form-check"><input type="checkbox" class="form-check-input" id="wp-star" checked><span class="form-check-label">Rotating star</span></label></div>
  <div id="wp-scales" aria-label="Same design at three rendering resolutions">
    <figure><canvas id="wp-lod1" role="img" aria-label="Distant map preview at one screen pixel per world pixel"></canvas><figcaption class="text-small">Far · 1 px / world pixel</figcaption></figure>
    <figure><canvas id="wp-lod2" role="img" aria-label="Map preview at two screen pixels per world pixel"></canvas><figcaption class="text-small">Mid · 2 px / world pixel</figcaption></figure>
    <figure><canvas id="wp-lod4" role="img" aria-label="Map preview at three screen pixels per world pixel"></canvas><figcaption class="text-small">Near · 3 px / world pixel</figcaption></figure>
  </div>
  <div class="viz-controls">
    <label class="form-label">Orbit <span id="wp-deg" class="tabular-nums">35°</span><input class="form-range" id="wp-orbit" type="range" min="0" max="360" value="35"></label>
    <label class="form-label">View<select class="form-select" id="wp-view"><option value="oblique">Map angle</option><option value="side" selected>Portrait angle</option><option value="top">From above</option></select></label>
    <label class="form-label">Faction<select class="form-select" id="wp-faction"><option value="#4c92b2">Blue</option><option value="#b44e36">Red</option><option value="#d7b543">Yellow</option><option value="#4c813a">Green</option></select></label>
  </div>
  <div id="wp-detail" class="text-small" aria-live="polite"></div>
  <div id="wp-error" role="alert" hidden></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="kit.js"></script><script src="star.js"></script><script src="pawn-b.js"></script><script src="viewer.js"></script></body></html>
